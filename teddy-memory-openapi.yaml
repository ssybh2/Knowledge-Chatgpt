openapi: 3.1.0
info:
  title: Teddy Memory API
  version: 0.4.0
  description: >-
    Read-only external long-term memory for Teddy. Use getContext for
    history-dependent questions, searchMemory for discovery, and
    getConversation for exact reconstruction of an old conversation.

servers:
  - url: https://teddy-memory-api.3767174214.workers.dev

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API_KEY

  schemas:
    SearchRequest:
      type: object
      properties:
        query:
          type: string
          description: Natural-language question or search intent.
        keywords:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
          description: >-
            Concrete retrieval terms. Strongly recommended for Chinese or
            mixed Chinese/English searches. Preserve exact technical names,
            model numbers, repository names and acronyms.
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
      anyOf:
        - required: [query]
        - required: [keywords]

    ContextRequest:
      type: object
      properties:
        query:
          type: string
          description: The current user's history-dependent question.
        keywords:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
          description: Concrete terms extracted from the user's request.
        max_conversations:
          type: integer
          minimum: 1
          maximum: 6
          default: 4
        before:
          type: integer
          minimum: 0
          maximum: 5
          default: 2
          description: Number of retrievable messages before the match.
        after:
          type: integer
          minimum: 0
          maximum: 8
          default: 3
          description: Number of retrievable messages after the match.
      anyOf:
        - required: [query]
        - required: [keywords]

paths:
  /v1/status:
    get:
      operationId: getMemoryStatus
      summary: Check Teddy Memory service status
      description: Public health check for the Worker and D1 archive.
      responses:
        "200":
          description: Service status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/auth-test:
    get:
      operationId: testMemoryAuthentication
      summary: Verify Bearer authentication
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Invalid or missing Bearer credential.

  /v1/search:
    post:
      operationId: searchMemory
      summary: Search historical ChatGPT memory
      description: >-
        Discover relevant old messages and conversations. Prefer explicit
        keywords, especially for Chinese or mixed-language queries. Use this
        when getContext is insufficient or when locating specific historical
        records.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Ranked historical matches.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid search request.
        "401":
          description: Invalid or missing Bearer credential.

  /v1/context:
    post:
      operationId: getContext
      summary: Retrieve relevant historical context for the current question
      description: >-
        Preferred memory tool for history-dependent questions. Finds relevant
        old messages and returns neighboring messages from the same historical
        conversations so the assistant can continue prior work with context.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextRequest"
      responses:
        "200":
          description: Relevant conversation context windows.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid context request.
        "401":
          description: Invalid or missing Bearer credential.

  /v1/conversation/{conversation_id}:
    get:
      operationId: getConversation
      summary: Retrieve one historical conversation in order
      description: >-
        Use when a search/context result identifies an important conversation
        and exact historical dialogue or chronology is needed.
      security:
        - bearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
          description: Conversation ID returned by searchMemory/getContext.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Conversation metadata and ordered retrievable messages.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Invalid or missing Bearer credential.
        "404":
          description: Conversation not found.

  /v1/verify-migration:
    get:
      operationId: verifyMemoryArchive
      summary: Verify archive integrity counts
      description: Read-only administrative verification of archive counts.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Archive verification counts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Invalid or missing Bearer credential.
